<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spider Anime — Auto Poster Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:24px 16px;text-align:center;background:linear-gradient(180deg,#170000,#090909);border-bottom:1px solid #351010}
h1{margin:0;color:#ff3030;font-size:30px}p{color:#aaa}.search{display:flex;gap:8px;max-width:720px;margin:20px auto;padding:0 12px}
input,select,button{border:1px solid #3b3b3b;background:#151515;color:#fff;border-radius:12px;padding:13px;font-size:15px}
input{flex:1}button{background:#b40000;border-color:#e11;cursor:pointer;font-weight:700}.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}.tab.active{background:#b40000}
#status{text-align:center;color:#aaa;min-height:28px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:1100px;margin:10px auto;padding:0 14px}
.card{background:#121212;border:1px solid #252525;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px #0008}
.card img{width:100%;height:225px;object-fit:cover;background:#222}.info{padding:10px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#aaa;margin-top:5px}
.empty{max-width:700px;margin:50px auto;text-align:center;color:#888}
</style>
</head>
<body>
<header>
  <h1>🕷️ Spider Anime</h1>
  <p>دموی دریافت خودکار پوستر و اطلاعات</p>
  <div class="search">
    <input id="q" placeholder="مثلاً Naruto یا One Piece" autocomplete="off">
    <button onclick="search()">جستجو</button>
  </div>
  <div class="tabs">
    <button class="tab active" id="animeTab" onclick="setType('anime')">انیمه</button>
    <button class="tab" id="seriesTab" onclick="setType('series')">سریال</button>
  </div>
</header>

<div id="status">یک عنوان جستجو کن 👆</div>
<main id="grid" class="grid"></main>

<script>
let type = "anime";

function setType(t){
  type=t;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.getElementById(t==="anime"?"animeTab":"seriesTab").classList.add("active");
  document.getElementById("status").textContent =
    t==="anime" ? "حالت انیمه: اطلاعات از Jikan دریافت می‌شود." :
                  "حالت سریال: اطلاعات از TVMaze دریافت می‌شود.";
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function search(){
  const q=document.getElementById("q").value.trim();
  if(!q) return;
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  document.getElementById("status").textContent="در حال دریافت اطلاعات... ⏳";
  try{
    if(type==="anime") await animeSearch(q); else await seriesSearch(q);
  }catch(e){
    document.getElementById("status").textContent="خطا در دریافت اطلاعات. اینترنت را بررسی کن.";
    console.error(e);
  }
}

async function animeSearch(q){
  const r=await fetch("https://api.jikan.moe/v4/anime?q="+encodeURIComponent(q)+"&limit=12");
  if(!r.ok) throw new Error("Jikan "+r.status);
  const j=await r.json();
  render(j.data.map(a=>({
    title:a.title,
    year:a.year || a.aired?.prop?.from?.year || "—",
    image:a.images?.jpg?.large_image_url || a.images?.jpg?.image_url,
    meta:(a.type||"Anime")+" • "+(a.episodes??"?")+" قسمت • ⭐ "+(a.score??"—"),
    description:a.synopsis || ""
  })));
}

async function seriesSearch(q){
  const r=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(q));
  if(!r.ok) throw new Error("TVMaze "+r.status);
  const j=await r.json();
  render(j.slice(0,12).map(x=>({
    title:x.show.name,
    year:(x.show.premiered||"").slice(0,4) || "—",
    image:x.show.image?.original || x.show.image?.medium,
    meta:(x.show.type||"Series")+" • "+(x.show.genres||[]).slice(0,3).join(" / "),
    description:(x.show.summary||"").replace(/<[^>]+>/g,"")
  })));
}

function render(items){
  const grid=document.getElementById("grid");
  if(!items.length){
    document.getElementById("status").textContent="نتیجه‌ای پیدا نشد.";
    return;
  }
  document.getElementById("status").textContent=`${items.length} نتیجه پیدا شد.`;
  grid.innerHTML=items.map(x=>`
    <article class="card">
      <img src="${esc(x.image||"")}" alt="${esc(x.title)}" loading="lazy"
           onerror="this.style.display='none'">
      <div class="info">
        <div class="title" title="${esc(x.title)}">${esc(x.title)}</div>
        <div class="meta">${esc(x.year)} • ${esc(x.meta)}</div>
      </div>
    </article>`).join("");
}

document.getElementById("q").addEventListener("keydown",e=>{
  if(e.key==="Enter") search();
});
</script>
</body>
</html>
